# Nginx Reverse Proxy Configuration for laymor3d.com
# Place at /etc/nginx/sites-available/laymor3d.conf and enable SSL with:
# sudo certbot --nginx -d laymor3d.com -d www.laymor3d.com

server {
    listen 80;
    server_name laymor3d.com www.laymor3d.com;

    client_max_body_size 100M;

    # 1. FastAPI Physics Sanity & Defect Predictor Backend for 3D Simulator
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Main Next.js 16 E-Commerce & AI Hub + /3dsim SPA (served via Next.js public/3dsim + rewrites)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
