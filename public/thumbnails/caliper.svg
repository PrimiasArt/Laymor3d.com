<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-verniercaliper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="glow-verniercaliper" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg-verniercaliper)" />
  <rect width="600" height="400" fill="url(#glow-verniercaliper)" />
  
  <!-- Perspective Print Bed Grid -->
  <g stroke="#1f2937" stroke-width="1.2" opacity="0.6">
    <path d="M50 340 L550 340 M100 365 L500 365 M150 385 L450 385" stroke-dasharray="6 4" />
    <path d="M150 385 L50 340 M250 385 L200 340 M350 385 L400 340 M450 385 L550 340" />
  </g>

  <!-- Main Themed Illustration -->
  <g filter="url(#shadow)">
    
    <!-- Main Rule Beam -->
    <rect x="150" y="190" width="320" height="24" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="2" />
    <!-- Millimeter Tick Marks -->
    
      <line x1="200" y1="190" x2="200" y2="202" stroke="#334155" stroke-width="1.5" />
    
      <line x1="220" y1="190" x2="220" y2="202" stroke="#334155" stroke-width="1.5" />
    
      <line x1="240" y1="190" x2="240" y2="202" stroke="#334155" stroke-width="1.5" />
    
      <line x1="260" y1="190" x2="260" y2="202" stroke="#334155" stroke-width="1.5" />
    
      <line x1="280" y1="190" x2="280" y2="202" stroke="#334155" stroke-width="1.5" />
    
      <line x1="300" y1="190" x2="300" y2="202" stroke="#334155" stroke-width="1.5" />
    
      <line x1="320" y1="190" x2="320" y2="202" stroke="#334155" stroke-width="1.5" />
    
      <line x1="340" y1="190" x2="340" y2="202" stroke="#334155" stroke-width="1.5" />
    
      <line x1="360" y1="190" x2="360" y2="202" stroke="#334155" stroke-width="1.5" />
    
      <line x1="380" y1="190" x2="380" y2="202" stroke="#334155" stroke-width="1.5" />
    
      <line x1="400" y1="190" x2="400" y2="202" stroke="#334155" stroke-width="1.5" />
    
      <line x1="420" y1="190" x2="420" y2="202" stroke="#334155" stroke-width="1.5" />
    
      <line x1="440" y1="190" x2="440" y2="202" stroke="#334155" stroke-width="1.5" />
    
      <line x1="460" y1="190" x2="460" y2="202" stroke="#334155" stroke-width="1.5" />
    
    <!-- Fixed Left Jaw -->
    <polygon points="150,190 150,285 175,270 175,190" fill="#94a3b8" stroke="#334155" stroke-width="2" />
    <polygon points="150,190 150,135 170,145 170,190" fill="#94a3b8" stroke="#334155" stroke-width="2" />
    <!-- Sliding Vernier Jaw -->
    <rect x="260" y="178" width="60" height="48" rx="3" fill="#3b82f6" stroke="#93c5fd" stroke-width="2" />
    <polygon points="260,226 260,285 280,270 280,226" fill="#2563eb" stroke="#93c5fd" stroke-width="2" />
    <!-- Digital LCD display -->
    <rect x="268" y="185" width="44" height="20" rx="3" fill="#0f172a" />
    <text x="290" y="200" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">25.40</text>
  
  </g>

  <!-- Badges -->
  <rect x="24" y="24" width="auto" height="26" rx="6" fill="#1e293b" stroke="#334155" opacity="0.9" />
  <text x="36" y="41" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">MEASUREMENT</text>
  <text x="576" y="41" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="end">VERNIER CALIPER</text>
</svg>