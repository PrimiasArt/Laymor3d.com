<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-batterydispenser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="glow-batterydispenser" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#a16207" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a16207" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#eab308" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg-batterydispenser)" />
  <rect width="600" height="400" fill="url(#glow-batterydispenser)" />
  
  <!-- Perspective Print Bed Grid -->
  <g stroke="#1f2937" stroke-width="1.2" opacity="0.6">
    <path d="M50 340 L550 340 M100 365 L500 365 M150 385 L450 385" stroke-dasharray="6 4" />
    <path d="M150 385 L50 340 M250 385 L200 340 M350 385 L400 340 M450 385 L550 340" />
  </g>

  <!-- Main Themed Illustration -->
  <g filter="url(#shadow)">
    
    <!-- Storage Rack Housing -->
    <rect x="220" y="110" width="160" height="190" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="3" />
    <!-- Vertical Dispenser Chute -->
    <line x1="250" y1="120" x2="250" y2="250" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="350" y1="120" x2="350" y2="250" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />
    <!-- Stacked Cylindrical Batteries -->
    
      <g>
        <rect x="260" y="140" width="76" height="28" rx="4" fill="#ca8a04" stroke="#fef08a" stroke-width="2" />
        <rect x="336" y="147" width="6" height="14" rx="2" fill="#fef08a" />
        <text x="298" y="158" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">18650</text>
      </g>
    
      <g>
        <rect x="260" y="180" width="76" height="28" rx="4" fill="#ca8a04" stroke="#fef08a" stroke-width="2" />
        <rect x="336" y="187" width="6" height="14" rx="2" fill="#fef08a" />
        <text x="298" y="198" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">18650</text>
      </g>
    
      <g>
        <rect x="260" y="220" width="76" height="28" rx="4" fill="#ca8a04" stroke="#fef08a" stroke-width="2" />
        <rect x="336" y="227" width="6" height="14" rx="2" fill="#fef08a" />
        <text x="298" y="238" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">18650</text>
      </g>
    
    <!-- Gravity Feed Output Lip -->
    <path d="M220 280 L280 305 L350 280" fill="none" stroke="#eab308" stroke-width="4" stroke-linecap="round" />
  
  </g>

  <!-- Badges -->
  <rect x="24" y="24" width="auto" height="26" rx="6" fill="#1e293b" stroke="#334155" opacity="0.9" />
  <text x="36" y="41" fill="#eab308" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">HOUSEHOLD</text>
  <text x="576" y="41" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="end">BATTERY DISPENSER</text>
</svg>