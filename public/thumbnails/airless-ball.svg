<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-airlessbasketball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="glow-airlessbasketball" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#f97316" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg-airlessbasketball)" />
  <rect width="600" height="400" fill="url(#glow-airlessbasketball)" />
  
  <!-- Perspective Print Bed Grid -->
  <g stroke="#1f2937" stroke-width="1.2" opacity="0.6">
    <path d="M50 340 L550 340 M100 365 L500 365 M150 385 L450 385" stroke-dasharray="6 4" />
    <path d="M150 385 L50 340 M250 385 L200 340 M350 385 L400 340 M450 385 L550 340" />
  </g>

  <!-- Main Themed Illustration -->
  <g filter="url(#shadow)">
    
    <!-- Outer Basketball Circle -->
    <circle cx="300" cy="200" r="95" fill="none" stroke="#ea580c" stroke-width="5" />
    <!-- Porous Hexagonal Lattice Matrix -->
    
      <polygon points="300,134 314,142 314,158 300,166 286,158 286,142" 
        fill="#0f172a" stroke="#f97316" stroke-width="3" />
    
      <polygon points="255,159 269,167 269,183 255,191 241,183 241,167" 
        fill="#0f172a" stroke="#f97316" stroke-width="3" />
    
      <polygon points="345,159 359,167 359,183 345,191 331,183 331,167" 
        fill="#0f172a" stroke="#f97316" stroke-width="3" />
    
      <polygon points="300,184 314,192 314,208 300,216 286,208 286,192" 
        fill="#0f172a" stroke="#f97316" stroke-width="3" />
    
      <polygon points="255,209 269,217 269,233 255,241 241,233 241,217" 
        fill="#0f172a" stroke="#f97316" stroke-width="3" />
    
      <polygon points="345,209 359,217 359,233 345,241 331,233 331,217" 
        fill="#0f172a" stroke="#f97316" stroke-width="3" />
    
      <polygon points="300,234 314,242 314,258 300,266 286,258 286,242" 
        fill="#0f172a" stroke="#f97316" stroke-width="3" />
    
      <polygon points="220,184 234,192 234,208 220,216 206,208 206,192" 
        fill="#0f172a" stroke="#f97316" stroke-width="3" />
    
      <polygon points="380,184 394,192 394,208 380,216 366,208 366,192" 
        fill="#0f172a" stroke="#f97316" stroke-width="3" />
    
    <!-- Motion lines -->
    <path d="M190 280 Q200 310 230 320" fill="none" stroke="#fed7aa" stroke-width="3" stroke-linecap="round" />
    <path d="M410 280 Q400 310 370 320" fill="none" stroke="#fed7aa" stroke-width="3" stroke-linecap="round" />
  
  </g>

  <!-- Badges -->
  <rect x="24" y="24" width="auto" height="26" rx="6" fill="#1e293b" stroke="#334155" opacity="0.9" />
  <text x="36" y="41" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">SPORTS & ELASTIC</text>
  <text x="576" y="41" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="end">AIRLESS BASKETBALL</text>
</svg>