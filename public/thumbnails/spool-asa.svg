<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-spool-asa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="glow-spool-asa" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow-asa" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ec4899" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg-spool-asa)" />
  <rect width="600" height="400" fill="url(#glow-spool-asa)" />
  
  <!-- Print Bed Grid Lines -->
  <g stroke="#1e293b" stroke-width="1.2" opacity="0.6">
    <path d="M50 350 L550 350 M100 375 L500 375" stroke-dasharray="6 4" />
    <path d="M150 375 L50 350 M250 375 L200 350 M350 375 L400 350 M450 375 L550 350" />
  </g>

  <!-- Spool Illustration (Cardboard eco-spool from Polymaker) -->
  <g filter="url(#shadow-asa)">
    <!-- Outer Flange (Recycled Kraft Cardboard) -->
    <circle cx="300" cy="190" r="115" fill="#78350f" stroke="#d97706" stroke-width="4" />
    <!-- Filament Coil Bed (Pure White ASA) -->
    <circle cx="300" cy="190" r="96" fill="#ffffff" stroke="#f1f5f9" stroke-width="2" />
    <!-- Coils Texture -->
    <circle cx="300" cy="190" r="88" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-dasharray="8 3" />
    <circle cx="300" cy="190" r="80" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="10 3" />
    <circle cx="300" cy="190" r="72" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-dasharray="7 2" />
    <circle cx="300" cy="190" r="64" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="9 3" />
    <!-- Inner Core Hub -->
    <circle cx="300" cy="190" r="54" fill="#451a03" stroke="#78350f" stroke-width="4" />
    <!-- Cutouts -->
    <circle cx="300" cy="155" r="10" fill="#292524" />
    <circle cx="330" cy="205" r="10" fill="#292524" />
    <circle cx="270" cy="205" r="10" fill="#292524" />
    <!-- Center Spindle Hole -->
    <circle cx="300" cy="190" r="22" fill="#0c0a09" stroke="#d97706" stroke-width="2.5" />
    <!-- UV Resistant Tag -->
    <rect x="286" y="112" width="28" height="12" rx="2" fill="#ec4899" opacity="0.9" />
    <text x="300" y="121" fill="#ffffff" font-family="monospace" font-size="7" font-weight="900" text-anchor="middle">UV-ASA</text>
  </g>

  <!-- Badges -->
  <rect x="24" y="24" width="auto" height="26" rx="6" fill="#1e293b" stroke="#334155" opacity="0.9" />
  <text x="36" y="41" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">WEATHERPROOF • UV RESIST</text>
  <text x="576" y="41" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">POLYMAKER POLYLITE ASA</text>
</svg>
