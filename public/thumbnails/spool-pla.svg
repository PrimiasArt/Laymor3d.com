<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-spool-pla" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="glow-spool-pla" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="spool-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow-pla" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg-spool-pla)" />
  <rect width="600" height="400" fill="url(#glow-spool-pla)" />
  
  <!-- Print Bed Grid Lines -->
  <g stroke="#1e293b" stroke-width="1.2" opacity="0.6">
    <path d="M50 350 L550 350 M100 375 L500 375" stroke-dasharray="6 4" />
    <path d="M150 375 L50 350 M250 375 L200 350 M350 375 L400 350 M450 375 L550 350" />
  </g>

  <!-- Spool Illustration -->
  <g filter="url(#shadow-pla)">
    <!-- Outer Flange -->
    <circle cx="300" cy="190" r="115" fill="url(#spool-rim)" stroke="#475569" stroke-width="5" />
    <!-- Filament Coil Bed (White Jade PLA) -->
    <circle cx="300" cy="190" r="96" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
    <!-- Coils Texture -->
    <circle cx="300" cy="190" r="88" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="8 3" />
    <circle cx="300" cy="190" r="80" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-dasharray="10 3" />
    <circle cx="300" cy="190" r="72" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="7 2" />
    <circle cx="300" cy="190" r="64" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-dasharray="9 3" />
    <!-- Inner Core Hub -->
    <circle cx="300" cy="190" r="54" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <!-- Spool Windows (Cutouts) -->
    <path d="M300 150 A40 40 0 0 1 335 170 L320 178 A22 22 0 0 0 300 168 Z" fill="#1e293b" />
    <path d="M335 210 A40 40 0 0 1 300 230 L300 212 A22 22 0 0 0 320 202 Z" fill="#1e293b" />
    <path d="M265 210 A40 40 0 0 1 265 170 L280 178 A22 22 0 0 0 280 202 Z" fill="#1e293b" />
    <!-- Center Spindle Hole -->
    <circle cx="300" cy="190" r="22" fill="#020617" stroke="#475569" stroke-width="2.5" />
    <!-- RFID Chip Icon -->
    <rect x="291" y="112" width="18" height="12" rx="2" fill="#6366f1" opacity="0.9" />
    <text x="300" y="121" fill="#ffffff" font-family="monospace" font-size="7" font-weight="900" text-anchor="middle">RFID</text>
  </g>

  <!-- Badges -->
  <rect x="24" y="24" width="auto" height="26" rx="6" fill="#1e293b" stroke="#334155" opacity="0.9" />
  <text x="36" y="41" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">BAMBU LAB • RFID</text>
  <text x="576" y="41" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">PLA BASIC 1.75MM</text>
</svg>
