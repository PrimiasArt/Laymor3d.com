<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-jetengineturbofan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="glow-jetengineturbofan" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#f97316" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg-jetengineturbofan)" />
  <rect width="600" height="400" fill="url(#glow-jetengineturbofan)" />
  
  <!-- Perspective Print Bed Grid -->
  <g stroke="#1f2937" stroke-width="1.2" opacity="0.6">
    <path d="M50 340 L550 340 M100 365 L500 365 M150 385 L450 385" stroke-dasharray="6 4" />
    <path d="M150 385 L50 340 M250 385 L200 340 M350 385 L400 340 M450 385 L550 340" />
  </g>

  <!-- Main Themed Illustration -->
  <g filter="url(#shadow)">
    
    <!-- Outer Nacelle Cowl -->
    <circle cx="300" cy="200" r="110" fill="#0f172a" stroke="#ea580c" stroke-width="8" />
    <circle cx="300" cy="200" r="98" fill="#1e293b" stroke="#fb923c" stroke-width="3" />
    <!-- Blades (Curved) -->
    
      <g transform="rotate(0 300 200)">
        <path d="M300 200 Q325 150 310 105" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" />
      </g>
    
      <g transform="rotate(30 300 200)">
        <path d="M300 200 Q325 150 310 105" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" />
      </g>
    
      <g transform="rotate(60 300 200)">
        <path d="M300 200 Q325 150 310 105" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" />
      </g>
    
      <g transform="rotate(90 300 200)">
        <path d="M300 200 Q325 150 310 105" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" />
      </g>
    
      <g transform="rotate(120 300 200)">
        <path d="M300 200 Q325 150 310 105" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" />
      </g>
    
      <g transform="rotate(150 300 200)">
        <path d="M300 200 Q325 150 310 105" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" />
      </g>
    
      <g transform="rotate(180 300 200)">
        <path d="M300 200 Q325 150 310 105" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" />
      </g>
    
      <g transform="rotate(210 300 200)">
        <path d="M300 200 Q325 150 310 105" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" />
      </g>
    
      <g transform="rotate(240 300 200)">
        <path d="M300 200 Q325 150 310 105" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" />
      </g>
    
      <g transform="rotate(270 300 200)">
        <path d="M300 200 Q325 150 310 105" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" />
      </g>
    
      <g transform="rotate(300 300 200)">
        <path d="M300 200 Q325 150 310 105" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" />
      </g>
    
      <g transform="rotate(330 300 200)">
        <path d="M300 200 Q325 150 310 105" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" />
      </g>
    
    <!-- Center Nose Cone -->
    <circle cx="300" cy="200" r="32" fill="#c2410c" stroke="#ffedd5" stroke-width="2.5" />
    <!-- Spiral Line on Cone -->
    <path d="M300 185 Q315 200 300 215" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  
  </g>

  <!-- Badges -->
  <rect x="24" y="24" width="auto" height="26" rx="6" fill="#1e293b" stroke="#334155" opacity="0.9" />
  <text x="36" y="41" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">AEROSPACE</text>
  <text x="576" y="41" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="end">JET ENGINE TURBOFAN</text>
</svg>