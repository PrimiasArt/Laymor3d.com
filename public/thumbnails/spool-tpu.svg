<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-spool-tpu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="glow-spool-tpu" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow-tpu" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg-spool-tpu)" />
  <rect width="600" height="400" fill="url(#glow-spool-tpu)" />
  
  <!-- Print Bed Grid Lines -->
  <g stroke="#1e293b" stroke-width="1.2" opacity="0.6">
    <path d="M50 350 L550 350 M100 375 L500 375" stroke-dasharray="6 4" />
    <path d="M150 375 L50 350 M250 375 L200 350 M350 375 L400 350 M450 375 L550 350" />
  </g>

  <!-- Spool Illustration -->
  <g filter="url(#shadow-tpu)">
    <!-- Outer Flange (Transparent Clear Spool) -->
    <circle cx="300" cy="190" r="115" fill="#0f172a" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.7" />
    <!-- Filament Coil Bed (Pure Black Flexible TPU) -->
    <circle cx="300" cy="190" r="96" fill="#020617" stroke="#1e293b" stroke-width="2" />
    <!-- Coils Texture -->
    <circle cx="300" cy="190" r="88" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="6 2" />
    <circle cx="300" cy="190" r="80" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8 2" />
    <circle cx="300" cy="190" r="72" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="5 2" />
    <circle cx="300" cy="190" r="64" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="7 2" />
    <!-- Inner Core Hub -->
    <circle cx="300" cy="190" r="54" fill="#0b0f19" stroke="#1e293b" stroke-width="4" />
    <!-- Cutouts -->
    <rect x="294" y="142" width="12" height="24" rx="3" fill="#1e293b" />
    <rect x="294" y="214" width="12" height="24" rx="3" fill="#1e293b" />
    <rect x="252" y="184" width="24" height="12" rx="3" fill="#1e293b" />
    <rect x="324" y="184" width="24" height="12" rx="3" fill="#1e293b" />
    <!-- Center Spindle Hole -->
    <circle cx="300" cy="190" r="22" fill="#000000" stroke="#38bdf8" stroke-width="2" />
    <!-- TPU 95A Tag -->
    <rect x="282" y="112" width="36" height="12" rx="2" fill="#38bdf8" opacity="0.9" />
    <text x="300" y="121" fill="#020617" font-family="monospace" font-size="7" font-weight="900" text-anchor="middle">TPU 95A</text>
  </g>

  <!-- Badges -->
  <rect x="24" y="24" width="auto" height="26" rx="6" fill="#1e293b" stroke="#334155" opacity="0.9" />
  <text x="36" y="41" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">FLEXIBLE • SHORE 95A</text>
  <text x="576" y="41" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">SUNLU TPU 95A</text>
</svg>
