<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gravitykarambit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="glow-gravitykarambit" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#9d174d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9d174d" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#ec4899" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg-gravitykarambit)" />
  <rect width="600" height="400" fill="url(#glow-gravitykarambit)" />
  
  <!-- Perspective Print Bed Grid -->
  <g stroke="#1f2937" stroke-width="1.2" opacity="0.6">
    <path d="M50 340 L550 340 M100 365 L500 365 M150 385 L450 385" stroke-dasharray="6 4" />
    <path d="M150 385 L50 340 M250 385 L200 340 M350 385 L400 340 M450 385 L550 340" />
  </g>

  <!-- Main Themed Illustration -->
  <g filter="url(#shadow)">
    
    <path d="M220 250 C200 170, 320 120, 390 170 C340 180, 290 220, 270 290 Z" fill="#db2777" stroke="#f472b6" stroke-width="3" />
    <circle cx="240" cy="270" r="26" fill="none" stroke="#f472b6" stroke-width="8" />
    <circle cx="240" cy="270" r="14" fill="#0f172a" stroke="#fbcfe8" stroke-width="2" />
    <path d="M280 180 Q340 160 370 180" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  
  </g>

  <!-- Badges -->
  <rect x="24" y="24" width="auto" height="26" rx="6" fill="#1e293b" stroke="#334155" opacity="0.9" />
  <text x="36" y="41" fill="#ec4899" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">TOYS & FIDGET</text>
  <text x="576" y="41" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="end">GRAVITY KARAMBIT</text>
</svg>