<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-bottle-resin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="glow-bottle-resin" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bottle-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow-resin" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg-bottle-resin)" />
  <rect width="600" height="400" fill="url(#glow-bottle-resin)" />
  
  <!-- Print Bed Grid Lines -->
  <g stroke="#1e293b" stroke-width="1.2" opacity="0.6">
    <path d="M50 350 L550 350 M100 375 L500 375" stroke-dasharray="6 4" />
    <path d="M150 375 L50 350 M250 375 L200 350 M350 375 L400 350 M450 375 L550 350" />
  </g>

  <!-- Resin Bottle Illustration -->
  <g filter="url(#shadow-resin)">
    <!-- Aluminum Light-blocking Bottle Body -->
    <rect x="235" y="140" width="130" height="175" rx="16" fill="url(#bottle-body)" stroke="#8b5cf6" stroke-width="3" />
    <!-- Shoulder Taper -->
    <polygon points="255,140 270,105 330,105 345,140" fill="#1e293b" stroke="#8b5cf6" stroke-width="2.5" />
    <!-- Bottle Neck -->
    <rect x="275" y="85" width="50" height="22" rx="2" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" />
    <!-- Screw Cap with Ribs -->
    <rect x="270" y="65" width="60" height="22" rx="4" fill="#a855f7" stroke="#c084fc" stroke-width="1.5" />
    <line x1="280" y1="68" x2="280" y2="84" stroke="#e9d5ff" stroke-width="1.5" />
    <line x1="290" y1="68" x2="290" y2="84" stroke="#e9d5ff" stroke-width="1.5" />
    <line x1="300" y1="68" x2="300" y2="84" stroke="#e9d5ff" stroke-width="1.5" />
    <line x1="310" y1="68" x2="310" y2="84" stroke="#e9d5ff" stroke-width="1.5" />
    <line x1="320" y1="68" x2="320" y2="84" stroke="#e9d5ff" stroke-width="1.5" />

    <!-- Front Product Label -->
    <rect x="245" y="155" width="110" height="135" rx="8" fill="#020617" stroke="#334155" stroke-width="1.5" />
    <!-- 8K Label Badge -->
    <rect x="255" y="170" width="90" height="24" rx="4" fill="#8b5cf6" />
    <text x="300" y="186" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="900" letter-spacing="2" text-anchor="middle">8K RESIN</text>
    
    <!-- Specs on label -->
    <text x="300" y="215" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">PHOTOPOLYMER</text>
    <text x="300" y="230" fill="#94a3b8" font-family="sans-serif" font-size="8" font-weight="500" text-anchor="middle">Space Grey • 1000g</text>
    
    <!-- Wave line -->
    <path d="M265 245 Q282 238 300 245 T335 245" fill="none" stroke="#a855f7" stroke-width="2" />
    <!-- UV 405nm pill -->
    <rect x="272" y="258" width="56" height="14" rx="7" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1" />
    <text x="300" y="268" fill="#c084fc" font-family="monospace" font-size="7.5" font-weight="700" text-anchor="middle">UV 405nm</text>
  </g>

  <!-- Badges -->
  <rect x="24" y="24" width="auto" height="26" rx="6" fill="#1e293b" stroke="#334155" opacity="0.9" />
  <text x="36" y="41" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">SLA • HIGH PRECISION</text>
  <text x="576" y="41" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">ELEGOO 8K RESIN 1000G</text>
</svg>
